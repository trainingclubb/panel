# Compila el instalador del panel en una máquina Windows de GitHub y lo publica como release.
# Con un tag vX.Y.Z (lo sube tc\publicar-panel.ps1) publica la versión; si se corre a mano, solo compila de prueba.
name: Publicar panel
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-panel
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar y publicar
        run: npx electron-builder --win nsis --x64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
